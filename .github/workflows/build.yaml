name: Build pacman repository

on:
  push:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git base-devel sudo

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create build user
        run: |
          useradd --create-home builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build all PKGBUILDs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/packages"

          find "$GITHUB_WORKSPACE/PKGBUILDs" \
            -mindepth 2 \
            -maxdepth 2 \
            -type f \
            -name PKGBUILD \
            -print0 |
          while IFS= read -r -d '' pkgbuild; do
            package_dir="$(dirname "$pkgbuild")"

            echo "::group::Building $package_dir"

            cd "$package_dir"

            rm -rf src pkg *.pkg.tar.* ClassiCube

            sudo -u builder makepkg \
              --syncdeps \
              --noconfirm \
              --cleanbuild \
              --clean

            find "$package_dir" \
              -maxdepth 1 \
              -type f \
              -name '*.pkg.tar.zst' \
              -exec cp {} "$GITHUB_WORKSPACE/packages/" \;

            echo "::endgroup::"
          done

      - name: Create pacman repository
        run: |
          cd "$GITHUB_WORKSPACE"

          rm -rf x86_64
          mkdir -p x86_64

          cp packages/*.pkg.tar.zst x86_64/

          cd x86_64

          repo-add venrepo.db.tar.gz *.pkg.tar.zst

          # repo-add creates symlinks; replace them with real files
          rm -f venrepo.db venrepo.files
          cp venrepo.db.tar.gz venrepo.db
          cp venrepo.files.tar.gz venrepo.files

      - name: Push generated repository
        run: |
          cd "$GITHUB_WORKSPACE"

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add x86_64/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update pacman repository"
            git push
          fi

      - name: Prepare GitHub Pages
        run: |
          cd "$GITHUB_WORKSPACE"

          rm -rf pages
          mkdir -p pages

          cp -r x86_64 pages/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
